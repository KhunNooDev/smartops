name: Assign SmartOps issue ID

on:
  issues:
    types: [opened]

permissions:
  issues: write

# Every run shares one queue. This prevents two newly opened issues from
# selecting the same next ID while their workflows overlap.
concurrency:
  group: smartops-issue-id-assignment
  queue: max

jobs:
  assign-id:
    runs-on: ubuntu-latest
    steps:
      - name: Assign next OPS ID
        uses: actions/github-script@v7
        with:
          script: |
            const idPattern = /^OPS-(\d+):\s/;

            // A re-run retains its original event payload, so fetch current
            // Issue state before deciding whether it already has an ID.
            const { data: currentIssue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
            });

            if (idPattern.test(currentIssue.title)) {
              core.info(`Issue #${currentIssue.number} already has a SmartOps ID.`);
              return;
            }

            const existingIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100,
              },
            );

            const highestAssignedId = existingIssues
              .filter((candidate) => !candidate.pull_request)
              .map((candidate) => {
                const match = candidate.title.match(idPattern);
                return match ? Number.parseInt(match[1], 10) : 0;
              })
              .reduce((highest, id) => Math.max(highest, id), 0);

            const nextId = String(highestAssignedId + 1).padStart(3, '0');
            const title = `OPS-${nextId}: ${currentIssue.title}`;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: currentIssue.number,
              title,
            });

            core.info(`Assigned OPS-${nextId} to issue #${currentIssue.number}.`);
